<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f3ef">
<title>Release Board — Software Lifecycle</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('lc-theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Tokens. Type: one sans, fixed rem scale. Space: 4px base. Colour: by role. */
:root {
  color-scheme: light;
  --page: #f3f3ef; --surface: #ffffff; --well: #f3f3ef;
  --ink: #14171a; --ink2: #434952; --ink3: #5f6671; --rule: #d8d8d1;
  --ok: #0a8a0a; --accent: #1b66c9;
  --warn: #fab219; --warn-tx: #7a4c00; --warn-bg: #fdefc9;
  --bad: #cc3535; --bad-tx: #9a1b1b; --bad-bg: #fbe1df;
  --fs-xl: 2.5rem; --fs-lg: 1.75rem; --fs-md: 1.25rem; --fs-b: 1rem; --fs-s: .875rem; --fs-xs: .8125rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s12: 48px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --disp: "Segoe UI Variable Display", "Segoe UI", -apple-system, system-ui, sans-serif;
  --text: "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1012; --surface: #181a1d; --well: #202328;
  --ink: #eceef1; --ink2: #bcc2cb; --ink3: #959da9; --rule: #2e333b;
  --ok: #1cb41c; --accent: #5aa5f5;
  --warn: #fab219; --warn-tx: #fbc44a; --warn-bg: #382c0b;
  --bad: #e25555; --bad-tx: #ff9d9d; --bad-bg: #3b1919;
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--rule) transparent; scrollbar-gutter: stable; scroll-padding-top: 110px; }
body { margin: 0; background: var(--page); color: var(--ink); font: var(--fs-b)/1.45 var(--text); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--accent); color: #fff; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { text-wrap: pretty; margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:disabled { cursor: default; color: var(--ink3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code, .mono { font-family: var(--mono); font-size: .9em; }
.ic { flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: var(--s4); top: -60px; z-index: 10; padding: var(--s2) var(--s4); background: var(--ink); color: var(--page); border-radius: 8px; }
.skip:focus { top: var(--s2); }
.in { max-width: 1480px; margin: 0 auto; padding-left: var(--s8); padding-right: var(--s8); }

/* ---- top line ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; padding-top: var(--s4); min-height: 56px; }
.top b { font-family: var(--disp); }
.top b + span { color: var(--ink2); margin-left: var(--s2); }
.util { display: flex; align-items: center; gap: var(--s1) var(--s4); flex-wrap: wrap; color: var(--ink2); font-size: var(--fs-s); }
.link { min-height: 40px; padding: 0 var(--s2); border-radius: 8px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.link:not(:disabled):hover { color: var(--ink); text-decoration-color: currentColor; }
.link:disabled { text-decoration: none; }
.notice { display: inline-flex; align-items: center; gap: var(--s2); padding-left: var(--s3); border-radius: 8px; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }

/* ---- the release in preparation: stepper ---- */
.hero { padding-top: var(--s6); padding-bottom: var(--s8); }
.hh { display: flex; align-items: baseline; gap: var(--s2) var(--s5); flex-wrap: wrap; margin-bottom: var(--s6); }
.hh h1 { font-family: var(--disp); font-size: var(--fs-xl); line-height: 1.05; font-weight: 700; letter-spacing: -.025em; }
.hh p { font-size: var(--fs-md); color: var(--ink2); }
.hh p b { color: var(--ink); font-weight: 600; }
.hh .cnt { margin-left: auto; color: var(--ink2); }
.phases { display: grid; grid-template-columns: 4fr 4fr 2fr; margin-bottom: var(--s4); }
.phases span { margin: 0 var(--s3); padding-bottom: var(--s2); border-bottom: 2px solid var(--rule); font-family: var(--disp); font-weight: 600; color: var(--ink2); text-align: center; }
.track { position: relative; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); }
.step { position: relative; }
.step::before { content: ""; position: absolute; top: 26px; left: -50%; width: 100%; height: 4px; background: var(--rule); }
.step:first-child::before { display: none; }
.step.reached::before { background: var(--ink); }
.step button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 0 var(--s1) var(--s3); text-align: center; border-radius: 12px; }
.ball { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--page); border: 3px solid var(--ink3); margin-bottom: var(--s2); font-family: var(--disp); font-weight: 700; font-size: 1.0625rem; transition: transform .14s var(--ease); }
.step button:active .ball { transform: scale(.96); }
.step.done .ball { background: var(--ok); border-color: var(--ok); }
.step.progress .ball { background: var(--warn); border-color: var(--warn-tx); color: #1a1300; }
.step.blocked .ball { background: var(--bad); border-color: var(--bad); }
.step.open .ball { box-shadow: 0 0 0 4px var(--page), 0 0 0 7px var(--ink); }
.sn { font-weight: 600; line-height: 1.25; }
.se { font-size: var(--fs-s); color: var(--ink2); line-height: 1.3; }
.step.blocked .se { color: var(--bad-tx); font-weight: 600; }
.step.late .se { color: var(--warn-tx); font-weight: 600; }
.now { position: absolute; top: 28px; left: calc(var(--n) * 10%); transform: translate(-50%, -50%); padding: 1px var(--s2); border-radius: 999px; background: var(--page); color: var(--accent); font-size: var(--fs-xs); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); pointer-events: none; white-space: nowrap; }
.panel { position: relative; margin-top: var(--s3); padding: var(--s6); background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s4) var(--s12); scroll-margin-top: 140px; }
.panel::before { content: ""; position: absolute; top: -8px; left: calc((var(--i) + .5) * 10% - 8px); width: 15px; height: 15px; background: var(--surface); border-left: 1px solid var(--rule); border-top: 1px solid var(--rule); transform: rotate(45deg); }
.panel.enter { animation: drop .2s var(--ease); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.panel h2 { font-family: var(--disp); font-size: var(--fs-md); margin-bottom: var(--s2); }
.panel p { margin-bottom: var(--s4); max-width: 62ch; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s4); margin: 0; font-size: var(--fs-s); }
dt { color: var(--ink3); }
dd { margin: 0; overflow-wrap: anywhere; color: var(--ink2); }
.chk label { display: flex; gap: var(--s3); align-items: center; min-height: 40px; cursor: pointer; overflow-wrap: anywhere; }
.chk input { accent-color: var(--ok); width: 20px; height: 20px; margin: 0; flex: none; }
.chk .dn { color: var(--ink3); }
.set { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s3); }
.set button, .seg button, .act { display: inline-flex; gap: var(--s2); align-items: center; min-height: 40px; padding: 0 var(--s3); border-radius: 10px; font-size: var(--fs-s); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--rule); transition: transform .12s var(--ease); }
.set button:active, .seg button:active, .act:active { transform: scale(.97); }
.set button[aria-pressed="true"], .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 2px var(--ink); }
.act { color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 2px var(--ink); margin-top: var(--s3); }
.file { margin: 0 0 var(--s4); font-family: var(--mono); font-size: var(--fs-xs); line-height: 1.75; color: var(--ink2); overflow-x: auto; }
.file div { display: flex; gap: var(--s3); white-space: nowrap; }
.file i { font-style: normal; color: var(--ink3); width: 20px; text-align: right; flex: none; }
.file .missing { color: var(--bad-tx); font-weight: 700; }

/* ---- the board: one column per version, same rows everywhere ---- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3) var(--s6); flex-wrap: wrap; margin-bottom: var(--s3); }
.bar h2 { font-family: var(--disp); font-size: var(--fs-md); }
.legend { display: flex; gap: var(--s2) var(--s4); flex-wrap: wrap; align-items: center; font-size: var(--fs-s); color: var(--ink2); margin-left: auto; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.seg { display: flex; gap: var(--s1); }
.board { display: grid; grid-template-columns: 132px repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(6, auto); background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; margin-bottom: 80px; }
.gut, .vcol { display: grid; grid-template-rows: subgrid; grid-row: 1 / -1; min-width: 0; }
.vcol { border-left: 1px solid var(--rule); }
.cell { padding: var(--s3) var(--s5) var(--s4); border-top: 1px solid var(--rule); min-width: 0; }
.gut .cell { padding: var(--s5) 0 0 var(--s5); font-family: var(--disp); font-weight: 600; }
.gut small { display: block; font-family: var(--text); font-weight: 400; font-size: var(--fs-xs); color: var(--ink3); }
.vh, .gut .cell:first-child { position: sticky; top: 0; z-index: 3; background: var(--surface); border-top: 0; box-shadow: 0 1px 0 var(--rule); }
.gut .cell:first-child { border-top-left-radius: 15px; }
.vcol:last-child .vh { border-top-right-radius: 15px; }
.vh { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding-top: var(--s4); padding-bottom: var(--s4); }
.vh h3 { font-family: var(--disp); font-size: var(--fs-lg); line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
.vh p { margin-top: 2px; color: var(--ink2); font-size: var(--fs-s); }
.sum { display: flex; align-items: center; gap: var(--s2); padding: 6px var(--s3) 6px var(--s2); border-radius: 999px; font-weight: 600; white-space: nowrap; background: var(--well); }
.sum.bad { background: var(--bad-bg); color: var(--bad-tx); }
.sum.warn { background: var(--warn-bg); color: var(--warn-tx); }
.r { display: flex; gap: var(--s3); align-items: flex-start; width: calc(100% + 16px); margin: 0 -8px; padding: var(--s2); border-radius: 10px; min-height: 44px; }
.r + .r, .inl + .r { margin-top: 2px; }
.rt { flex: 1; min-width: 0; }
.rt b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.rt b.mono { font-size: .9375rem; }
.rt > span { display: block; font-size: var(--fs-s); color: var(--ink2); overflow-wrap: anywhere; }
.r.bad { background: var(--bad-bg); }
.r.bad b, .r.bad .rt > span, .r.bad .chev { color: var(--bad-tx); }
.r.miss { background: var(--warn-bg); }
.r.miss b, .r.miss .rt > span, .r.miss .chev { color: var(--warn-tx); }
.r.todo b { font-weight: 500; color: var(--ink2); }
.rt b code { font-size: var(--fs-s); font-weight: 600; color: var(--ink2); margin-left: var(--s1); white-space: nowrap; }
.chev { flex: none; align-self: center; color: var(--ink3); transition: transform .15s var(--ease); }
.r[aria-expanded="true"] .chev { transform: rotate(90deg); }
.hist { display: flex; gap: 3px; align-items: flex-end; height: 24px; flex: none; align-self: center; }
.hist i { width: 6px; height: 14px; border-radius: 2px; background: var(--ink3); opacity: .45; }
.hist i.f { height: 24px; background: var(--bad); opacity: 1; }
.ver { margin: 0 0 var(--s2); color: var(--ink2); font-size: var(--fs-s); }
.ver code { color: var(--ink); font-weight: 600; }
.more { margin-top: var(--s2); font-size: var(--fs-s); color: var(--ink3); display: flex; gap: var(--s2); align-items: center; }
.inl { padding: var(--s1) 0 var(--s3) 44px; }
.inl p { font-size: var(--fs-s); margin-bottom: var(--s2); max-width: 60ch; }
.empty { padding: var(--s3) 0; color: var(--ink2); font-size: var(--fs-s); max-width: 44ch; }

@media (hover: hover) and (pointer: fine) {
  .step button:hover .ball { transform: scale(1.06); }
  button.r:hover { box-shadow: inset 0 0 0 1.5px currentColor; }
  .set button:hover, .seg button:hover { color: var(--ink); }
}
@media (max-width: 1040px) {
  .in { padding-left: var(--s4); padding-right: var(--s4); }
  .hh h1 { font-size: 2rem; }
  .phases, .now { display: none; }
  .steps { grid-template-columns: minmax(0, 1fr); gap: var(--s1); }
  .step::before { display: none; }
  .step button { flex-direction: row; text-align: left; gap: var(--s4); padding: var(--s1); }
  .ball { margin: 0; width: 44px; height: 44px; flex: none; }
  .sn { flex: 1; }
  .panel { grid-template-columns: minmax(0, 1fr); padding: var(--s4); }
  .panel::before { display: none; }
  .board { display: block; }
  .gut { display: none; }
  .vcol { display: block; border-left: 0; border-top: 8px solid var(--page); }
  .vcol:first-of-type { border-top: 0; }
  .vcol:first-of-type .vh { border-radius: 15px 15px 0 0; }
  .cell[data-l]::before { content: attr(data-l); display: block; font-family: var(--disp); font-weight: 600; margin-bottom: var(--s1); }
  .legend { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .ball, .chev, .set button, .seg button, .act { transition: none; }
  .panel.enter { animation: fade .2s linear; }
}
@keyframes fade { from { opacity: 0; } }
</style>
</head>

<header class="in top">

<main>

<script>
/* ============================================================
   MOCK DATA. Replace this block with real Bitbucket / TeamCity /
   JFrog / deployment data later; the rendering below only reads
   G (the checkable steps) and the plain objects in this block.
   ============================================================ */
const TODAY = '2026-11-16';
const day = s => new Date(s + 'T12:00:00');
const diff = (a, b) => Math.round((day(a) - day(b)) / 864e5);
const dfmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
const nfmt = new Intl.NumberFormat('en-GB');
const fmt = s => dfmt.format(day(s));
const days = n => `${n} day${n === 1 ? '' : 's'}`;
const when = s => { const n = diff(s, TODAY); return n === 0 ? 'today' : n > 0 ? `in ${days(n)}` : `${days(-n)} ago`; };
/* Escape, then keep a number and the word after it on one line ("3 min", "9 Nov"). */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/(\d) (?=\S)/g, '$1&nbsp;');

const PREP = '26.4', LIVE = '26.3', NEXT = { v: '27.1', cut: '2027-02-15' };
const STATUS = { todo: 'Not started', progress: 'In progress', done: 'Done', blocked: 'Blocked' };
const JOBS = ['Build', 'Unit tests', 'Integration tests', 'Packaging', 'Nightly regression'];
const ARTIFACTS = ['Installer', 'Docker image', 'DB bundle', 'Checksums and SBOM'];

/* Checkable steps, by id. Board rows read their state from here, so ticking a
   box in a checklist changes the matching row on the board. */
const G = {};
function gate(id, o) {
  G[id] = { id, ...o, subs: o.subs.map((t, i) => ({ t, done: o.mask ? !!o.mask[i] : o.status === 'done' })) };
}
const N = PREP.replace('.', '');
[ // key, short name, full title, owner, status, date, checklist, extra
  ['cut', 'Branch created', `Create branch release/${PREP}`, 'Camille R.', 'done', '2026-11-09',
    [`release/${PREP} created from master`, 'Branch permissions applied', 'Default reviewers and merge checks set'],
    { src: `bitbucket.example.com/orion/suite/branch/release/${PREP}`, note: 'Cut from master at a91f3c2.' }],
  ['tc', 'TeamCity jobs', 'Duplicate the TeamCity jobs', 'Hugo B.', 'progress', '2026-11-12',
    [`VCS root points at release/${PREP}`, ...JOBS.map(j => `Job “${j}” created (Orion_${N}_${j.replace(/ /g, '')})`)],
    { mask: [1, 1, 1, 1, 0, 0], src: `teamcity.example.com/project/Orion_Release${N}`,
      note: 'Packaging and Nightly regression still have to be copied from the master templates. Until Packaging exists, nothing can be published to JFrog or deployed.' }],
  ['bump', 'Version bump', 'Bump versions', 'Camille R.', 'done', '2026-11-09',
    ['master moved to 27.1.0-SNAPSHOT', `release/${PREP} pinned to ${PREP}.0`, 'Changelog section opened'],
    { src: 'bitbucket.example.com/orion/suite/commits' }],
  ['head', 'head.txt', `releases/${PREP}/head.txt`, 'Inès D.', 'blocked', '2026-11-10',
    [`releases/${PREP}/head.txt created`, 'Every listed script exists in the repo', 'Execution order reviewed by the DBA'],
    { mask: [1, 0, 0], why: '1 script missing', file: true, src: `bitbucket.example.com/orion/db-scripts/releases/${PREP}/head.txt`,
      note: 'head.txt lists 0444_add_audit_index.sql, but that script is not in the repo yet. Merge db-scripts PR #77 to unblock this.' }],
  ['dbrun', 'DB dry-run', 'DB upgrade dry-run', 'Inès D.', 'todo', '2026-11-20',
    ['Fresh install from head.txt', `Upgrade from ${LIVE}`, 'Rollback scripts checked'],
    { src: 'teamcity.example.com/buildConfiguration/Orion_DbDryRun', note: 'Needs a complete head.txt first.' }],
  ['freeze', 'Code freeze', 'Code freeze', 'Camille R.', 'todo', '2026-11-23',
    [`release/${PREP} restricted to release managers`, 'Freeze announced to the teams'],
    { src: 'bitbucket.example.com/orion/suite/settings/branch-permissions' }],
  ['rc', 'RC build', 'Release-candidate build', 'Hugo B.', 'todo', '2026-11-25',
    ['Build green on the release branch', 'Integration suite green', 'RC tagged and deployed to QA'],
    { src: `teamcity.example.com/buildConfiguration/Orion_${N}_Build` }],
  ['qa', 'QA sign-off', 'QA sign-off', 'Sofia K.', 'todo', '2026-12-04',
    ['Regression campaign', 'Performance baseline', 'Sign-off recorded'], { src: `qa.example.com/campaigns/orion-${PREP}` }],
  ['jfrog', 'JFrog package', 'Package on JFrog', 'Lucas M.', 'todo', '2026-12-09',
    ARTIFACTS.map(a => `${a} published`), { src: `jfrog.example.com/artifactory/orion-release-local/${PREP}.0/` }],
  ['ga', 'GA', 'General availability', 'Camille R.', 'todo', '2026-12-14',
    ['Tag created', 'Release notes published', 'Deployed to PROD'], { src: `bitbucket.example.com/orion/suite/tags/v${PREP}.0` }],
].forEach(([key, short, title, owner, status, date, subs, x], i) => gate(`s:${key}`, { i, short, title, owner, status, date, subs, ...x }));
const STEPS = Object.values(G);

gate('hf', { short: 'Hotfix 26.3.2', title: 'Hotfix 26.3.2', owner: 'Lucas M.', status: 'progress', date: '2026-11-13', mask: [1, 1, 1, 0, 1, 0, 0],
  subs: ['Fix merged to release/26.3', 'Build green', ...ARTIFACTS.map(a => `${a} published`), 'Tag created'],
  src: 'jfrog.example.com/artifactory/orion-release-local/26.3.2/', note: 'The Docker image push failed: storage quota reached on orion-docker-local. Free space or raise the quota, then re-run Packaging.' });

const HEAD_TAIL = ['0439_view_open_orders.sql', '0440_alter_export_job.sql', '0441_seed_feature_flags.sql', '0442_idx_orders_created.sql', '0443_grant_reporting_role.sql', '0444_add_audit_index.sql'];

/* Static facts per version. RUNS: last run of each TeamCity job, plus the outcome of
   the recent runs, oldest first (p = passed, f = failed). */
const JOBID = { master: 'Orion_Master', [PREP]: `Orion_${N}`, [LIVE]: 'Orion_263' };
const RUNS = {
  master: [['#4812, 3 min', 'pppppppppp'], [`${nfmt.format(6412)} passed, 5 min`, 'pppfpppppp'], ['318 passed, 4 min', 'pppppppppp'], ['#4812, 2 min', 'ppfppppppp'], [`Last night, ${nfmt.format(1204)} passed`, 'pppppppppp']],
  [PREP]: [['#37, 3 min', 'ppp'], [`${nfmt.format(6398)} passed, 5 min`, 'ppp'], ['318 passed, 4 min', 'ppp'], null, null],
  [LIVE]: [['#212, 3 min', 'pppppppppp'], [`${nfmt.format(6371)} passed, 5 min`, 'pppppppppp'], ['311 passed, 4 min', 'pppppppppp'], ['#212, 2 min', 'pppppppppp'], [`Last night, ${nfmt.format(1187)} passed`, 'ppppppfppp']],
};
const FILES = [['orion-setup-{v}.exe', '412 MB'], ['orion/app:{v}', '1.1 GB'], ['orion-db-{v}.zip', '18 MB'], ['orion-{v}.sha256 and orion-{v}.cdx.json', '2 files']];

/* ============================================================
   STATE. Edits are kept in this browser only; the open step and
   the filter are also written to the URL so a view can be shared.
   ============================================================ */
const KEY = 'lc-board-v1';
const snapshot = () => Object.fromEntries(Object.values(G).map(g => [g.id, { status: g.status, subs: g.subs.map(s => s.done) }]));
const apply = o => Object.entries(o).forEach(([id, v]) => { if (G[id]) { G[id].status = v.status; G[id].subs.forEach((s, i) => { s.done = !!v.subs[i]; }); } });
const PRISTINE = snapshot();
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
apply(saved);
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
function persist(g) { saved[g.id] = { status: g.status, subs: g.subs.map(s => s.done) }; store(); }

let openGate = null, openRow = null, onlyProblems = false, undo = null, enter = false, noticeTimer = 0;
(function readUrl() {
  const p = new URLSearchParams(location.hash.slice(1)), st = p.get('step');
  if (st && G[`s:${st}`]) openGate = `s:${st}`;
  onlyProblems = p.get('show') === 'problems';
})();
function writeUrl() {
  const p = new URLSearchParams();
  if (openGate && openGate !== 'hf') p.set('step', openGate.slice(2));
  if (onlyProblems) p.set('show', 'problems');
  const h = p.toString();
  try { history.replaceState(null, '', h ? `#${h}` : location.pathname + location.search); } catch (e) {}
}
const say = t => { document.getElementById('live').textContent = t; };
const nDone = g => g.subs.filter(s => s.done).length;
const late = g => g.status !== 'done' && g.date ? Math.max(0, diff(TODAY, g.date)) : 0;
function evidence(g) {
  const l = late(g);
  if (g.status === 'done') return fmt(g.date);
  if (g.status === 'blocked') return g.why || 'Blocked';
  if (g.status === 'progress') return `${nDone(g)} of ${g.subs.length}${l ? `, ${days(l)} late` : ''}`;
  return l ? `${days(l)} late` : fmt(g.date);
}

function icon(k, size = 24) {
  const body = {
    ok: `<circle r="10.4" fill="var(--ok)"/><path d="M-4.7 .3 L-1.5 3.5 L4.9 -3.3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`,
    prog: `<circle r="9" fill="none" stroke="var(--warn-tx)" stroke-width="2.4"/><path d="M0 -9 A9 9 0 0 1 0 9 Z" fill="var(--warn-tx)"/>`,
    warn: `<path d="M0 -9 L9.8 8 H-9.8 Z" fill="var(--warn)" stroke="var(--warn-tx)" stroke-width="2" stroke-linejoin="round"/><path d="M0 -3.2 V2.2" stroke="#1a1300" stroke-width="2.4" stroke-linecap="round"/><circle cy="5.4" r="1.4" fill="#1a1300"/>`,
    bad: `<path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="var(--bad)"/><path d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`,
    todo: `<circle r="9" fill="none" stroke="var(--ink3)" stroke-width="2.4"/>`,

  }[k];
  return `<svg class="ic" width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true">${body}</svg>`;
}
const WORD = { ok: 'OK', prog: 'In progress', todo: 'Not yet', miss: 'Missing', bad: 'Failing' };
const gk = g => ({ done: 'ok', progress: 'prog', blocked: 'bad', todo: 'todo' }[g.status]);
const isProblem = r => r.k === 'bad' || r.k === 'miss';
const CHEV = `<svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 L10.5 8 L6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function checklist(g) {
  return `<div data-g="${g.id}"><div class="chk">${g.subs.map((s, i) => `<label><input type="checkbox" data-sub="${i}" data-k="c-${g.id}-${i}" ${s.done ? 'checked' : ''}><span class="${s.done ? 'dn' : ''}">${esc(s.t)}</span></label>`).join('')}</div>
    <div class="set" role="group" aria-label="Status of this step">${Object.keys(STATUS).map(k =>
      `<button data-set="${k}" data-k="set-${g.id}-${k}" aria-pressed="${g.status === k}">${icon({ done: 'ok', progress: 'prog', blocked: 'bad', todo: 'todo' }[k], 18)}${STATUS[k]}</button>`).join('')}</div></div>`;
}
function fileHtml(g) {
  const ok = g.subs[1].done;
  return `<div class="file" translate="no" aria-label="Last lines of head.txt">` + HEAD_TAIL.map((f, i) => {
    const miss = !ok && i === HEAD_TAIL.length - 1;
    return `<div><i>${39 + i}</i><span class="${miss ? 'missing' : ''}">${f}${miss ? '  ← not in the repo' : ''}</span></div>`;

}
const facts = x => `<dl>${x.map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`;

/* One board row: { k: icon kind, t: title, d: detail, mono, hist, tag, x: facts shown when opened, gate: step it belongs to } */
function row(o, key) {
  const open = openRow === key, can = !!(o.x || o.gate);
  const side = o.hist ? (() => { const f = [...o.hist].filter(c => c === 'f').length, l = `${o.hist.length - f} of the last ${o.hist.length} runs passed`;
      return `<span class="hist" role="img" aria-label="${l}" title="${l}">${[...o.hist].map(c => `<i class="${c}"></i>`).join('')}</span>`; })()
    : '';
  const inner = `${icon(o.k)}<span class="rt"><b class="${o.mono ? 'mono' : ''}"${o.mono ? ' translate="no"' : ''}>${esc(o.t)}${o.tag ? ` <code translate="no">${o.tag}</code>` : ''}</b><span><span class="sr">${WORD[o.k]}. </span>${esc(o.d)}</span></span>${side}${can ? CHEV : ''}`;
  const cls = `r ${['bad', 'miss', 'todo'].includes(o.k) ? o.k : ''}`;
  if (!can) return `<div class="${cls}">${inner}</div>`;

  return `<button class="${cls}" data-row="${key}" data-k="r-${key}" aria-expanded="${open}">${inner}</button>${body}`;
}

function renderTop() {

function renderHero() {

      ${due > 0 && due < STEPS.length ? `<span class="now" style="--n:${due}" aria-hidden="true">Today</span>` : ''}

      <div><h2>${esc(open.title)}</h2>${open.note ? `<p>${esc(open.note)}</p>` : ''}${open.file ? fileHtml(open) : ''}

      ${checklist(open)}</div>` : ''}`;

/* What each column shows, section by section. */
const tcFacts = (v, i) => { const [last, h] = RUNS[v][i], f = [...h].filter(c => c === 'f').length;
  return [['Job', `${JOBID[v]}_${JOBS[i].replace(/ /g, '')}`], ['Last run', last], ['Recent runs', f ? `${h.length - f} of the last ${h.length} passed` : `All of the last ${h.length} passed`], ['Agent', `tc-agent-0${i % 3 + 1}`]]; };
const jfFacts = (ver, repo, i) => [['File', FILES[i][0].replace(/\{v\}/g, ver)], ['Size', FILES[i][1]], ['Path', `${repo}/${ver}/`]];
const envRows = v => ENVS[v].map(([n, ver, d, k, host, prev]) => ({ k, t: n, tag: ver, d, x: [['Address', host], ['Running', ver], ['Before that', prev]] }));
function cells(v) {

      { k: 'prog', t: 'feature/sso-okta', mono: true, d: 'In review for 9 days, waiting for the security review', x: [['Pull request', '#482, 2 approvals'], ['Author', 'Lucas M.'], ['Build', 'Green']] },
      { k: 'bad', t: 'fix/export-timeout', mono: true, d: 'Build failing: 3 integration tests red in ExportJobIT. Fix them to merge.', x: [['Pull request', '#491, opened 14 Nov'], ['Author', 'Inès D.'], ['Failing', 'ExportJobIT, 3 tests']] }],
    codeMore: 'Merged this week: feature/audit-log and fix/import-npe.',

    db: [{ k: 'ok', t: 'head.txt', mono: true, d: `14 scripts queued for ${NEXT.v}, all present`, x: [['File', 'db-scripts/head.txt'], ['Last change', 'Today at 09:12, Inès D.']] },
      { k: 'ok', t: 'Nightly run on the DEV database', d: 'Green last night' }],

    env: envRows('master'),

  if (v === PREP) {
    const tc = G['s:tc'], head = G['s:head'], dr = G['s:dbrun'], jf = G['s:jfrog'], cut = G['s:cut'], bump = G['s:bump'];
    const pack = tc.subs[4].done;
    return {
      name: PREP, sub: 'In preparation.',
      code: [{ k: gk(cut), t: `release/${PREP}`, mono: true, d: cut.status === 'done' ? `Cut ${fmt(cut.date)} from a91f3c2, 3 commits since` : 'Branch not ready yet', gate: cut.id },
        { k: gk(bump), t: 'Version', d: bump.status === 'done' ? `Pinned to ${PREP}.0` : 'Not bumped yet', gate: bump.id }],
      tc: JOBS.map((j, i) => {
        const run = RUNS[PREP][i];
        if (!tc.subs[i + 1].done) return { k: 'miss', t: j, d: `Job not created yet${late(tc) ? `, ${days(late(tc))} late` : ''}`, gate: tc.id };
        return run ? { k: 'ok', t: j, d: run[0], hist: run[1], x: tcFacts(PREP, i), gate: tc.id } : { k: 'todo', t: j, d: 'Created, no run yet', gate: tc.id };
      }),
      db: [{ k: gk(head), t: `releases/${PREP}/head.txt`, mono: true, gate: head.id,
          d: head.status === 'done' ? '44 scripts, all present' : head.subs[1].done ? '44 scripts, waiting for the DBA review' : '44 listed, 1 not in the repo. Merge db-scripts PR #77.' },

      ver: [`${PREP}.0`, 'orion-release-local'],

        : { k: 'todo', t: a, d: pack ? 'Not published yet' : 'Waiting for the Packaging job', gate: jf.id }),
      env: [], noEnv: `No environment runs ${PREP} yet. QA takes it as soon as a package exists.`,
    };

  return {
    name: LIVE, sub: hf.status === 'done' ? 'Live since 28 Sep. Hotfix 26.3.2 is out.' : 'Live since 28 Sep. Hotfix 26.3.2 under way.',
    code: [{ k: 'ok', t: `release/${LIVE}`, mono: true, d: 'Last commit 13 Nov, “Fix invoice rounding”', x: [['Author', 'Hugo B.'], ['Built as', '#212']] }, { k: 'ok', t: 'Version', d: 'Pinned to 26.3.2' }],
    tc: JOBS.map((j, i) => ({ k: 'ok', t: j, d: RUNS[LIVE][i][0], hist: RUNS[LIVE][i][1], x: tcFacts(LIVE, i) })),
    db: [{ k: 'ok', t: `releases/${LIVE}/head.txt`, mono: true, d: '41 scripts, all present' }, { k: 'ok', t: 'Upgrade dry-run', d: 'Passed 26 Aug' }],
    ver: ['26.3.2', 'orion-release-local'],
    jf: [...ARTIFACTS.map((a, i) => art(i) ? { k: 'ok', t: a, d: 'Published 13 Nov', x: jfFacts('26.3.2', 'orion-release-local', i) }
        : i === 1 ? { k: 'bad', t: a, d: 'Push failed: storage quota reached. Free space, then re-run Packaging.', x: [['Repository', 'orion-docker-local'], ['Quota', '50 GB, 49.8 GB used'], ['Failed', '13 Nov at 16:41']] }
        : { k: 'todo', t: a, d: art(1) ? 'Not published yet' : 'Waits for the Docker image' }),
      { k: gk(hf), t: 'Hotfix 26.3.2', d: `${evidence(hf)}. Open for the checklist.`, gate: 'hf' }],
    jfMore: '26.3.1 is complete, published 26 Oct.',
    env: envRows(LIVE),

}
function renderBoard() {
  const labels = [['Code', 'Bitbucket'], ['Build and test', 'TeamCity'], ['DB scripts', 'head.txt'], ['Package', 'JFrog'], ['Running on', 'Environments']];
  const section = (v, i, rows, extra = '') => {
    const shown = onlyProblems ? rows.filter(isProblem) : rows, hidden = rows.length - shown.length;
    const rest = !onlyProblems ? extra : !hidden ? '' : `<p class="more">${shown.length ? `${hidden} more, all fine` : `${icon('ok', 18)}All ${hidden} fine`}</p>`;
    return `<div class="cell" role="group" aria-label="${labels[i][0]}, ${v}" data-l="${labels[i][0]}">${shown.map(r => row(r, `${v}|${i}|${r.t}`)).join('')}${rest}</div>`;
  };
  const cols = ['master', PREP, LIVE].map(v => {
    const c = cells(v), n = [...c.code, ...c.tc, ...c.db, ...c.jf, ...c.env].filter(isProblem).length;
    const sum = n ? `<div class="sum bad">${icon('bad', 26)}${n} to fix</div>` : `<div class="sum">${icon('ok', 26)}All good</div>`;
    return `<article class="vcol" aria-label="${c.name}">
      <header class="cell vh"><div><h3 translate="no">${c.name}</h3><p>${esc(c.sub)}</p></div>${sum}</header>
      ${section(v, 0, c.code, c.codeMore ? `<p class="more">${c.codeMore}</p>` : '')}
      ${section(v, 1, c.tc)}
      ${section(v, 2, c.db)}
      ${section(v, 3, c.jf, c.jfMore ? `<p class="more">${esc(c.jfMore)}</p>` : '').replace('">', `"><p class="ver"><code translate="no">${c.ver[0]}</code> in ${c.ver[1]}</p>`)}
      ${c.env.length ? section(v, 4, c.env) : `<div class="cell" role="group" aria-label="Running on, ${v}" data-l="Running on"><p class="empty">${esc(c.noEnv)}</p></div>`}
    </article>`;
  });
  document.getElementById('board').innerHTML = `<div class="gut" aria-hidden="true"><div class="cell"></div>${labels.map(([a, b]) => `<div class="cell">${a}<small>${b}</small></div>`).join('')}</div>` + cols.join('');
  document.getElementById('bar').innerHTML = `<h2 id="bh">Where each version stands</h2>
    <div class="legend" aria-hidden="true">${Object.entries(WORD).map(([k, w]) => `<span>${icon(k, 18)}${w}</span>`).join('')}</div>
    <div class="seg" role="group" aria-label="Rows to show">
      <button data-show="all" data-k="show-all" aria-pressed="${!onlyProblems}">All rows</button>
      <button data-show="problems" data-k="show-problems" aria-pressed="${onlyProblems}">Problems only</button></div>`;
}
function renderAll(focusKey) {
  const k = focusKey || (document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null);
  renderTop(); renderHero(); renderBoard(); writeUrl();
  const again = k && document.querySelector(`[data-k="${CSS.escape(k)}"]`);

/* ============================================================
   INTERACTION
   ============================================================ */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
function changed(g) {
  undo = null; persist(g);
  say(`${g.title}: ${STATUS[g.status]}, ${nDone(g)} of ${g.subs.length} done.`);
  renderAll();
}
document.addEventListener('click', e => {
  const t = e.target;
  const set = t.closest('[data-set]');
  if (set) {
    const g = G[set.closest('[data-g]').dataset.g];
    g.status = set.dataset.set;
    if (g.status === 'done') g.subs.forEach(s => { s.done = true; });
    if (g.status === 'todo') g.subs.forEach(s => { s.done = false; });
    return changed(g);
  }
  const step = t.closest('[data-step]');
  if (step) { const id = step.dataset.step; enter = openGate !== id && e.detail > 0; openGate = openGate === id ? null : id; return renderAll(); }
  const go = t.closest('[data-gate]');
  if (go) {                                   // "Open step" inside a board row: show the step and move there
    openGate = go.dataset.gate; enter = e.detail > 0;
    renderAll(`st-${openGate}`);
    return document.getElementById('panel').scrollIntoView({ block: 'center', behavior: calm() });
  }
  const r = t.closest('[data-row]');
  if (r) { openRow = openRow === r.dataset.row ? null : r.dataset.row; return renderAll(); }
  const show = t.closest('[data-show]');
  if (show) { onlyProblems = show.dataset.show === 'problems'; return renderAll(); }
  if (t.closest('#theme')) {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('lc-theme', next); } catch (err) {}
    return renderTop(), document.getElementById('theme').focus();
  }
  if (t.closest('#reset')) {                  // undo instead of a confirmation dialog
    undo = saved; saved = {}; store(); apply(PRISTINE);
    say('Your changes were discarded. Undo is available.');
    clearTimeout(noticeTimer); noticeTimer = setTimeout(() => { undo = null; renderTop(); }, 12000);
    return renderAll('undo');
  }
  if (t.closest('[data-undo]')) {
    saved = undo; undo = null; store(); apply(saved); clearTimeout(noticeTimer);
    say('Your changes are back.');
    return renderAll('reset');
  }
});
document.addEventListener('change', e => {
  if (!e.target.matches('[data-sub]')) return;
  const g = G[e.target.closest('[data-g]').dataset.g];
  g.subs[+e.target.dataset.sub].done = e.target.checked;
  const n = nDone(g);
  g.status = n === g.subs.length ? 'done' : g.status === 'blocked' ? 'blocked' : n ? 'progress' : 'todo';
  changed(g);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (openRow || openGate)) {
    const back = openRow ? `r-${openRow}` : `st-${openGate}`;
    if (openRow) openRow = null; else openGate = null;
    return renderAll(back);
  }
  const b = e.target.closest && e.target.closest('.steps button');
  if (!b || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const all = [...document.querySelectorAll('.steps button')], i = all.indexOf(b);
  const to = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : Math.min(all.length - 1, Math.max(0, i + (e.key === 'ArrowRight' ? 1 : -1)));
  e.preventDefault(); all[to].focus();
});
addEventListener('hashchange', () => {
  const p = new URLSearchParams(location.hash.slice(1)), st = p.get('step');
  openGate = st && G[`s:${st}`] ? `s:${st}` : openGate === 'hf' ? 'hf' : null;
  onlyProblems = p.get('show') === 'problems';
  renderAll();
});
renderAll();
</script>
</body>
</html>
